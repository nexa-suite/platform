<main class="security-page" aria-labelledby="security-title"><h1 id="security-title">{{ 'iamSecurity.profileTitle' | translate }}</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ 'iamSecurity.displayName' | translate }}<input formControlName="displayName" autocomplete="name"></label><label>{{ 'iamSecurity.email' | translate }}<input [value]="facade.profile()?.email" readonly autocomplete="email"></label><label>{{ 'iamSecurity.phone' | translate }}<input formControlName="phone" autocomplete="tel"></label><label>{{ 'iamSecurity.language' | translate }}<select formControlName="preferredLanguage"><option value="es">ES</option><option value="en">EN</option></select></label><label>{{ 'iamSecurity.timezone' | translate }}<input formControlName="timezone" autocomplete="off"></label><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.save' | translate }}</button></form>@if (facade.message()) { <p role="status" class="success">{{ facade.message()! | translate }}</p> } @if (facade.error()) { <p role="alert" class="error">{{ facade.error()! | translate }}</p> }</main>
