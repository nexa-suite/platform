<main class="security-page" aria-labelledby="security-title"><h1 id="security-title">{{ 'iamSecurity.onboardingTitle' | translate }}</h1><p>{{ 'iamSecurity.onboardingDescription' | translate }}</p><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ 'iamSecurity.legalName' | translate }}<input formControlName="legalName" autocomplete="organization"></label><label>{{ 'iamSecurity.displayName' | translate }}<input formControlName="displayName"></label><label>{{ 'iamSecurity.operation' | translate }}<select formControlName="operationCategory"><option value="b2bColdChainDistributor">{{ 'iamSecurityOperationOptions.distributor' | translate }}</option><option value="refrigeratedWarehouseOperator">{{ 'iamSecurityOperationOptions.warehouse' | translate }}</option><option value="foodServiceSupplier">{{ 'iamSecurityOperationOptions.foodService' | translate }}</option><option value="thirdPartyColdStorage">{{ 'iamSecurityOperationOptions.thirdPartyStorage' | translate }}</option></select></label><label>{{ 'iamSecurity.storageSite' | translate }}<input formControlName="storageSiteName"></label><label>{{ 'iamSecurity.address' | translate }}<input formControlName="storageSiteAddress" autocomplete="street-address"></label><label>{{ 'iamSecurity.founder' | translate }}<input formControlName="founderDisplayName" autocomplete="name"></label><label>{{ 'iamSecurity.email' | translate }}<input type="email" formControlName="founderEmail" autocomplete="email"></label><label>{{ 'iamSecurity.workspace' | translate }}<input formControlName="workspaceName"></label><label>{{ 'iamSecurity.slug' | translate }}<input formControlName="workspaceSlug" autocomplete="off"></label><label>{{ 'iamSecurity.plan' | translate }}<select formControlName="referencePlan"><option value="Starter">{{ 'iamSecurityPlanOptions.starter' | translate }}</option><option value="Standard">{{ 'iamSecurityPlanOptions.standard' | translate }}</option><option value="Professional">{{ 'iamSecurityPlanOptions.professional' | translate }}</option><option value="Enterprise">{{ 'iamSecurityPlanOptions.enterprise' | translate }}</option></select></label><p class="terms-copy">{{ 'iamSecurity.terms' | translate }} · version {{ form.controls.termsVersion.value }}</p><label class="terms"><input type="checkbox" formControlName="termsAccepted"> I accept the displayed terms.</label><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.submit' | translate }}</button></form>@if (facade.error()) { <p role="alert" class="error">{{ facade.error()! | translate }}</p> }</main>
