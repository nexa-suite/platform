<main class="security-page" aria-labelledby="security-title"><h1 id="security-title">{{ 'iamSecurity.passwordTitle' | translate }}</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>{{ 'iamSecurity.currentPassword' | translate }}<input type="password" autocomplete="current-password" formControlName="currentPassword"></label><label>{{ 'iamSecurity.newPassword' | translate }}<input type="password" autocomplete="new-password" formControlName="newPassword"></label><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.save' | translate }}</button></form>@if (facade.message()) { <p role="status" class="success">{{ facade.message()! | translate }}</p> } @if (facade.error()) { <p role="alert" class="error">{{ facade.error()! | translate }}</p> }</main>
