<article class="metric-card">
  <div class="metric-heading">
    <span>{{ label() }}</span>
    <span class="metric-mark" aria-hidden="true">@if (icon(); as iconName) { <nexa-icon [name]="iconName" /> }</span>
  </div>
  <strong>{{ value() }}</strong>
  @if (hint()) { <p>{{ hint() }}</p> }
</article>
