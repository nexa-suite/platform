<section class="empty-state" [class.compact]="compact()" aria-live="polite">
  @if (icon()) { <span class="icon" aria-hidden="true">{{ icon() }}</span> }
  <h2>{{ title() }}</h2>
  @if (description()) { <p>{{ description() }}</p> }
  <div class="action"><ng-content select="[empty-state-action]" /></div>
</section>
