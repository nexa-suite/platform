<main class="security-page" aria-labelledby="security-title"><a routerLink="/sign-in" class="back-link">{{ 'iamSecurity.back' | translate }}</a><h1 id="security-title">{{ 'iamSecurity.forgotTitle' | translate }}</h1><p>{{ 'iamSecurity.forgotDescription' | translate }}</p><form [formGroup]="form" (ngSubmit)="submit()"><label for="reset-email">{{ 'iamSecurity.email' | translate }}</label><input id="reset-email" type="email" autocomplete="email" formControlName="email"><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.send' | translate }}</button></form>@if (facade.message()) { <p role="status" class="success">{{ facade.message()! | translate }}</p> } @if (facade.error()) { <p role="alert" class="error">{{ facade.error()! | translate }}</p> }</main>
