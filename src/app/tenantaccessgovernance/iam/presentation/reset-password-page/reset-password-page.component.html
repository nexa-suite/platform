<main class="security-page" aria-labelledby="security-title"><a routerLink="/sign-in" class="back-link">{{ 'iamSecurity.back' | translate }}</a><h1 id="security-title">{{ 'iamSecurity.resetTitle' | translate }}</h1><p>{{ 'iamSecurity.resetDescription' | translate }}</p><form [formGroup]="form" (ngSubmit)="submit()"><label for="reset-token">{{ 'iamSecurity.token' | translate }}</label><input id="reset-token" formControlName="token" autocomplete="off"><label for="new-password">{{ 'iamSecurity.newPassword' | translate }}</label><input id="new-password" type="password" autocomplete="new-password" formControlName="newPassword"><button type="submit" [disabled]="form.invalid || facade.busy()">{{ 'iamSecurity.save' | translate }}</button></form>@if (facade.message()) { <p role="status" class="success">{{ facade.message()! | translate }}</p> } @if (facade.error()) { <p role="alert" class="error">{{ facade.error()! | translate }}</p> }</main>
